[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-oepl"
version = "0.1.0"
description = "Async Python client for the OpenDisplay AP (OpenEPaperLink)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pillow>=10.0",
    "numpy>=1.20",
    "epaper-dithering>=0.1",
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "rich>=14.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "mypy>=1.0",
]

[project.scripts]
oepl = "oepl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oepl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
