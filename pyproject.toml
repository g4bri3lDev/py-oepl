[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-oepl"
version = "0.3.0"
description = "Async Python client for the OpenEPaperLink AP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["openepaperlink", "oepl", "eink", "epaper", "iot", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
cli = [
    "rich>=14.3.4",
]
dither = [
    "epaper-dithering>=6.0.0,<7.0.0",
]
all = [
    "rich>=14.3.4",
    "epaper-dithering>=6.0.0,<7.0.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5.0",
    "aioresponses>=0.7.8",
    "mypy>=1.0",
    "ruff>=0.4",
    "prek>=0.3.4",
]

[project.scripts]
oepl = "oepl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oepl"]

[tool.hatch.build.targets.sdist]
# Keep device-captured test payloads (tests/golden_images) out of published artifacts
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
