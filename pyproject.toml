[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-oepl"
version = "0.1.0"
description = "Async Python client for the OpenDisplay AP (OpenEPaperLink)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["openepaperlink", "oepl", "eink", "epaper", "iot", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9",
    "pillow>=10.0",
    "numpy>=1.20",
    "epaper-dithering>=0.6.4",
    "rich>=14.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5.0",
    "aioresponses>=0.7.8",
    "mypy>=1.0",
    "ruff>=0.4",
    "prek>=0.3.4",
]

[project.scripts]
oepl = "oepl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oepl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["src/oepl/g5_decoder.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "oepl.g5_decoder"
ignore_errors = true
