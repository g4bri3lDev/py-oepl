name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
  id-token: write  # For PyPI trusted publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Manifest mode. release-type lives in the config file, which also
          # points at src/oepl/__init__.py via extra-files: the python strategy
          # derives the module path from the distribution name, so it looks for
          # src/py_oepl/ and never finds src/oepl/ on its own. Both paths are
          # passed explicitly because the action defaults config-file to
          # "release-please-config.json", without the leading dot.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # The following steps only run if a release was created
      - name: Checkout code
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v6

      - name: Install uv
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        run: uv sync

      - name: Build package
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        run: uv build

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
